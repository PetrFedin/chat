# Рабочее пространство целиком: приложение, база и накат миграций.
#
#   cp .env.example .env   # и заполнить секреты
#   docker compose up -d
#
# Миграции накатываются отдельным разовым контейнером, а не при старте
# приложения. Так они не выполняются одновременно двумя копиями при
# масштабировании, и падение наката не выглядит как падение сервиса.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      # Готовность именно нужной базы, а не сервера вообще: иначе
      # миграции стартуют в момент, когда база ещё создаётся.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat} -d ${POSTGRES_DB:-chat}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chat}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chat}
      # Без него сейф паролей отвечает 503 и честно объясняет почему.
      VAULT_KEY: ${VAULT_KEY:?задайте VAULT_KEY в .env, 32 байта в base64}
      # Только на время смены ключа: см. scripts/rotate-vault-key.mjs.
      VAULT_KEY_PREVIOUS: ${VAULT_KEY_PREVIOUS:-}
      # Адрес наружу — для ссылок в письмах.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Почта: без MAIL_HOST приглашения и сброс пароля придётся
      # передавать руками — приложение об этом прямо говорит.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ChatX}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Метрики и подробный /healthz в production отдаются только с этим токеном (Authorization: Bearer …).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      NODE_ENV: ${NODE_ENV:-production}
      # Хранилище файлов: без S3 вложения лежат на томе /data.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      # Итоги встреч: запись звонка и ИИ-обработка включаются только явно.
      LIVEKIT_EGRESS_ENABLED: ${LIVEKIT_EGRESS_ENABLED:-}
      MEETING_TRANSCRIPTION_PROVIDER: ${MEETING_TRANSCRIPTION_PROVIDER:-}
      MEETING_SUMMARY_PROVIDER: ${MEETING_SUMMARY_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_ASSISTANT_PROVIDER: ${CHAT_ASSISTANT_PROVIDER:-}
      # Демо-режим в production блокируется, пока явно не разрешён.
      DEMO_MODE: ${DEMO_MODE:-}
      ALLOW_DEMO_IN_PRODUCTION: ${ALLOW_DEMO_IN_PRODUCTION:-}
    volumes:
      - uploads:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Регулярные резервные копии: база и вложения одной папкой, старые удаляются по BACKUP_KEEP.
  # Копии лежат в отдельном томе: если потерян том приложения, копия остаётся. Для надёжности
  # периодически вывозите их с машины (rsync, облако): копия на том же диске — не защита от диска.
  # Запуск: docker compose --profile backup up -d backup
  backup:
    build: .
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chat}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    command: ["sh", "-c", "while true; do node scripts/backup.mjs || echo 'копия не снялась, повторим через интервал'; sleep \"$$BACKUP_INTERVAL_SECONDS\"; done"]
    volumes:
      - uploads:/data
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Резервная копия по расписанию запускается не здесь: планировщик — дело
  # хозяина машины. Снять копию тем же образом:
  #   docker compose run --rm app node scripts/backup.mjs
  # Проверить, что она разворачивается:
  #   docker compose run --rm app node scripts/restore.mjs --from /data/backups/… --check

volumes:
  postgres:
  uploads:
  backups:
