<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex,nofollow">
  <title>Выбрать время встречи · ChatX</title>
  <link rel="stylesheet" href="/email-booking.css">

<body>
  <main class="booking-card">
    <a class="booking-brand" href="/" aria-label="ChatX">Chat<span>X</span></a>
