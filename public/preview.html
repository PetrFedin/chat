<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatX Device Preview</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f2f2ef}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column}
    header{height:72px;padding:12px 18px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:14px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
    .brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
    .brand strong{font-size:18px}.brand span{font-size:12px;color:#777}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    button,a{font:inherit}
    button{border:1px solid #d5d5d1;background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}
    button.active{background:#171717;color:#fff;border-color:#171717}
    #meta{font-size:12px;color:#666;min-width:115px;text-align:right}
    main{flex:1;min-height:0;padding:22px;display:grid;place-items:center;overflow:auto}
    #stage{position:relative;transition:width .2s,height .2s}
    #device{position:absolute;left:50%;top:0;transform-origin:top center;box-sizing:content-box;background:#111;border:10px solid #191919;border-radius:26px;box-shadow:0 18px 60px rgba(0,0,0,.18);overflow:hidden}
    #device.monitor{border-radius:14px;border-width:8px}
    #device.tablet{border-radius:24px}
    #device.phone{border-radius:34px}
    iframe{display:block;border:0;background:#fff;width:100%;height:100%}
    .hint{font-size:12px;color:#777}
    @media(max-width:760px){header{height:auto;align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}#meta{text-align:left}}
  </style>
</head>
<body>
<header>
  <div class="brand"><strong>ChatX · Device Preview</strong><span>живой localhost</span></div>
  <div class="controls">
    <button data-device="phone">Телефон</button>
    <button data-device="tablet">Планшет</button>
    <button data-device="monitor">Монитор</button>
    <button id="reload">Обновить</button>
    <span id="meta"></span>
  </div>
</header>
<main id="workspace">
  <div id="stage"><div id="device"><iframe id="app" src="/"></iframe></div></div>
</main>
<script src="/preview.js"></script>
</body>
</html>
