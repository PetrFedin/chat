name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply migrations
        run: |
          psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/migrations/001_core.sql
          psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/migrations/002_tenant_integrity.sql
          psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/migrations/003_collaboration_primitives.sql
          psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/migrations/004_application_platform.sql
          psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/migrations/005_identity_realtime.sql
          psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/migrations/006_realtime_media.sql
          psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/migrations/007_daily_work_completion.sql
          psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/migrations/008_meeting_intelligence.sql
          psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/migrations/009_meeting_product_surface.sql
          psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/migrations/010_meeting_processing_observability.sql
          psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/migrations/011_meeting_ops_cost_control.sql
      - name: Verify core constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_core.sql
      - name: Verify collaboration constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_collaboration.sql
      - name: Verify application-platform constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_platform.sql
      - name: Verify identity and realtime constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_identity_realtime.sql
      - name: Verify realtime media constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_realtime_media.sql
      - name: Verify daily work constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_daily_work.sql
      - name: Verify meeting intelligence constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_meeting_intelligence.sql
      - name: Verify meeting product surface constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_meeting_product_surface.sql
      - name: Verify meeting processing observability constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_meeting_processing_observability.sql
      - name: Verify meeting operations and cost constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_meeting_ops_cost_control.sql
      - name: Verify daily work Postgres runtime
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_test
        run: node --test test/postgres-daily-work.test.js
      - name: Verify meeting intelligence Postgres runtime
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_test
        run: node --test test/postgres-meeting-intelligence.test.js
      - name: Verify meeting processing observability Postgres runtime
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_test
        run: node --test test/postgres-meeting-processing-observability.test.js
      - name: Verify meeting operations and cost Postgres runtime
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_test
        run: node --test test/postgres-meeting-ops-cost-control.test.js
      - name: Verify persistent preview Postgres runtime
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_test
        run: node --test test/postgres-preview-demo.test.js
