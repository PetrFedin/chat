name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # `--ignore-scripts` above means Playwright's own postinstall (which
      # would normally fetch its browser) never ran — install the browser
      # explicitly instead, same principle as the Dockerfile comment: no
      # package runs its own code as a side effect of being installed.
      - name: Install the headless browser for the smoke test
        run: npx playwright install --with-deps chromium
      - run: npm test

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        # Продукт требует 17: миграция 047 меняет выражение генерируемого
        # столбца через `ALTER COLUMN ... SET EXPRESSION`, а это умеет
        # только PostgreSQL 17+. CI с образом 16 был красным с самого
        # слияния — версия здесь обязана совпадать с docker-compose.yml.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The full suite below includes browser-smoke.test.js, and this job
      # sets DATABASE_URL — so it runs that test against real PostgreSQL,
      # not the memory store domain-tests already exercised. Needs its own
      # copy of the browser install for the same reason as domain-tests:
      # `--ignore-scripts` skipped Playwright's postinstall download.
      - name: Install the headless browser for the smoke test
        run: npx playwright install --with-deps chromium
      # Ubuntu's own apt repo ships one postgresql-client version tied to
      # the Ubuntu release, while the service above and the shipped
      # Dockerfile are both on 17 — `pg_dump` refuses to dump a server
      # newer than itself. The runner image already carries its own
      # `pg_dump` earlier on PATH (a 16.x build baked into the image, not
      # installed by apt/alternatives), so installing postgresql-client-17
      # alone is not enough: it has to be put ahead of that on PATH
      # explicitly, or the pre-existing binary keeps winning.
      - name: Install a matching postgresql-client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Apply migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_test
      - name: Verify core constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_core.sql
      - name: Verify collaboration constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_collaboration.sql
      - name: Verify application-platform constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_platform.sql
      - name: Verify identity and realtime constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_identity_realtime.sql
      - name: Verify realtime media constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_realtime_media.sql
      - name: Verify daily work constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_daily_work.sql
      - name: Verify meeting intelligence constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_meeting_intelligence.sql
      - name: Verify meeting product surface constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_meeting_product_surface.sql
      - name: Verify meeting processing observability constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_meeting_processing_observability.sql
      - name: Verify meeting operations and cost constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_meeting_ops_cost_control.sql
      - name: Verify integration delivery constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_integration_delivery.sql
      - name: Verify org structure constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_org_structure.sql
      - name: Verify knowledge base constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_knowledge_base.sql
      - name: Verify Telegram bridge constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_telegram_bridges.sql
      - name: Verify calendar ICS feed constraints
        run: psql -h localhost -U postgres -d chat_test -v ON_ERROR_STOP=1 -f db/test_calendar_ics_feed.sql

      # Весь набор целиком, а не выбранные файлы по именам.
      #
      # Раньше здесь перечислялись восемнадцать файлов из тридцати трёх, и
      # список отставал от каталога: матрица «роль × маршрут» и проверка
      # изоляции арендаторов — самые тщательные тесты в проекте — не
      # запускались вообще ни в одном job. Зелёный CI о них не знал.
      #
      # VAULT_KEY здесь одноразовый: без него тесты сейфа вырождаются в
      # «всем 503», то есть проверяют недоступность вместо доступа.
      - name: Run the whole suite against PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_test
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/chat_test
        run: |
          export VAULT_KEY="$(openssl rand -base64 32)"
          node --test
